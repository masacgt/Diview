<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#171f33" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Circular Accent Borders -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="6" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Stylized Coin Pile & Trend -->
  <g transform="translate(4, 12)" filter="url(#glow)">
    <!-- Base Coin shadow -->
    <ellipse cx="256" cy="340" rx="90" ry="25" fill="#000" opacity="0.3" />
    <!-- Coin Body -->
    <ellipse cx="256" cy="330" rx="90" ry="25" fill="url(#coinGrad)" />
    <!-- Inner Coin circle -->
    <ellipse cx="256" cy="327" rx="72" ry="20" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <!-- Coin Emblem (Yen symbol) -->
    <path d="M 236 312 L 256 325 L 276 312 M 256 325 L 256 342 M 244 326 L 268 326 M 244 332 L 268 332" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward Trend Line -->
    <path d="M 120 370 Q 180 340 220 250 T 380 140" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <!-- Arrowhead -->
    <path d="M 350 140 L 380 140 L 380 170" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sparkle star -->
    <path d="M 380 110 L 385 130 L 405 135 L 385 140 L 380 160 L 375 140 L 355 135 L 375 130 Z" fill="#4edea3" />
  </g>
</svg>
