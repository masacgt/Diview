name: Yfinance Legacy Dividend Event Audit

on:
  push:
    branches:
      - codex/yfinance-legacy-event-audit-20261025
      - codex/yfinance-financial-coverage-20261018
    paths:
      - .github/workflows/yfinance-legacy-event-audit.yml
      - scripts/yfinance_r2/audit_legacy_dividend_events.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-r2-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the R2 client
        run: python -m pip install "boto3>=1.35,<2"
      - name: Compare legacy dividend actions with V2 and archive records
        run: python scripts/yfinance_r2/audit_legacy_dividend_events.py --report r2-legacy-dividend-audit/report.json
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save the read-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-legacy-dividend-event-audit-${{ github.run_id }}
          path: r2-legacy-dividend-audit/report.json
          if-no-files-found: ignore
          retention-days: 7
