name: Sync Japanese market data to R2 v2

on:
  push:
    paths:
      - "scripts/yfinance_r2/**"
      - ".github/workflows/yfinance-r2.yml"
  pull_request:
    paths:
      - "scripts/yfinance_r2/**"
      - ".github/workflows/yfinance-r2.yml"
  schedule:
    # 12:17 UTC is 21:17 JST, after the Tokyo market close and away from the hourly boundary.
    - cron: "17 12 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run tests, a benchmark, the full R2 sync, publish the initial income-advice catalog from stored V2 data, refresh one security's annual financials, reaggregate stored dividend streaks, normalize December-price dates, audit split-transition dividends, seed app-used financial values into v2, or migrate legacy IRBANK fiscal-year dividend records into v2
        type: choice
        options:
          - test
          - benchmark
          - sync
          - generate-income-advice
          - refresh-financials
          - reaggregate-dividend-streaks
          - repair-monthly-prices
          - split-audit
          - migrate-financials
          - migrate-irbank-dividends
        default: benchmark
        required: true
      sample_size:
        description: Number of J-Quants securities to sample in benchmark mode
        type: number
        default: 40
        required: true
      benchmark_workers:
        description: yfinance ticker workers for a single benchmark run
        type: choice
        options:
          - "16"
          - "24"
        default: "16"
        required: true
      target_code:
        description: Security code for refresh-financials mode
        type: string
        default: "7203"
        required: true

permissions:
  contents: read

concurrency:
  group: yfinance-r2-v2
  cancel-in-progress: false

jobs:
  market-calendar:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'sync')
    runs-on: ubuntu-latest
    outputs:
      is_open: ${{ steps.check.outputs.is_open }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install exchange calendar dependency
        run: python -m pip install "exchange_calendars>=4.7,<5"
      - name: Check Tokyo Stock Exchange session
        id: check
        run: python scripts/yfinance_r2/check_market_day.py
        env:
          ALLOW_CLOSED_MARKET: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'sync' }}

  v2-daily-sync:
    needs: market-calendar
    if: needs.market-calendar.outputs.is_open == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Fetch J-Quants universe and publish the yfinance v2 generation
        run: |
          args=(--publish --workers 24)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--reprocess-successful --allow-one-extra-attempt)
          fi
          python scripts/yfinance_r2/sync_v2.py "${args[@]}"
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
          YFINANCE_V2_WORKERS: "24"
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data

  legacy-financial-v2-migration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'migrate-financials'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the R2 client
        run: python -m pip install "boto3>=1.35,<2"
      - name: Seed app-used legacy financial values into v2 and verify each write
        run: set -o pipefail; python scripts/yfinance_r2/migrate_legacy_financials.py --workers 12 --report legacy-financial-migration-report.json 2>&1 | tee legacy-financial-migration.log
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data

  v2-income-advice-initial-generation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'generate-income-advice'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install V2 and R2 dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Build the initial candidate catalog from stored V2 records and verify R2 read-back
        run: set -o pipefail; python scripts/yfinance_r2/generate_income_advice.py --publish 2>&1 | tee income-advice-initial-generation.log
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save initial-generation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-income-advice-initial-generation-${{ github.run_id }}
          path: income-advice-initial-generation.log
          if-no-files-found: ignore
          retention-days: 30

  legacy-irbank-dividend-v2-migration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'migrate-irbank-dividends'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the R2 client
        run: python -m pip install "boto3>=1.35,<2"
      - name: Copy legacy IRBANK fiscal-year dividend records into v2 and verify each write
        run: set -o pipefail; python scripts/yfinance_r2/migrate_legacy_dividends.py --workers 32 --report legacy-dividend-migration-report.json 2>&1 | tee legacy-dividend-migration.log
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data

      - name: Save migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-v2-irbank-dividend-migration-${{ github.run_id }}
          path: |
            legacy-dividend-migration.log
            legacy-dividend-migration-report.json
          if-no-files-found: ignore
          retention-days: 30

  yfinance-targeted-financial-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'refresh-financials'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install yfinance and R2 dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Refresh one security's annual V2 financial records
        run: set -o pipefail; python scripts/yfinance_r2/refresh_financial_v2.py --code "${TARGET_CODE}" 2>&1 | tee targeted-financial-refresh.log
        shell: bash
        env:
          TARGET_CODE: ${{ inputs.target_code }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save targeted financial refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-targeted-financial-refresh-${{ github.run_id }}
          path: targeted-financial-refresh.log
          if-no-files-found: ignore
          retention-days: 30

  yfinance-sample-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Measure a stratified J-Quants sample without R2 writes
        run: set -o pipefail; python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee benchmark-output.txt
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_BENCHMARK_SAMPLE_SIZE: ${{ inputs.sample_size }}
          YFINANCE_BENCHMARK_WORKERS: ${{ inputs.benchmark_workers }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
          YFINANCE_BENCHMARK_ACTION_REPORT_PATH: benchmark-action-comparison.json
      - name: Save benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-sample-benchmark-${{ github.run_id }}
          path: |
            benchmark-output.txt
            benchmark-action-*.json
            benchmark-action-comparison.json
          if-no-files-found: ignore
          retention-days: 30

  yfinance-capacity-study:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[yfinance-capacity-study]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Measure 20 and 500 security workloads at 16 and 24 workers
        run: |
          set -euo pipefail
          YFINANCE_BENCHMARK_SAMPLE_SIZE=20 YFINANCE_BENCHMARK_WORKERS=16 YFINANCE_BENCHMARK_ACTION_REPORT_PATH=benchmark-action-20-16.json python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee -a benchmark-output.txt
          YFINANCE_BENCHMARK_SAMPLE_SIZE=500 YFINANCE_BENCHMARK_WORKERS=16 YFINANCE_BENCHMARK_ACTION_REPORT_PATH=benchmark-action-500-16.json python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee -a benchmark-output.txt
          YFINANCE_BENCHMARK_SAMPLE_SIZE=500 YFINANCE_BENCHMARK_WORKERS=24 YFINANCE_BENCHMARK_ACTION_REPORT_PATH=benchmark-action-500-24.json python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee -a benchmark-output.txt
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
      - name: Save capacity study report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-capacity-study-${{ github.run_id }}
          path: |
            benchmark-output.txt
            benchmark-action-*.json
          if-no-files-found: ignore
          retention-days: 30

  yfinance-full-universe-study:
    needs: [yfinance-sync-tests, yfinance-capacity-study]
    if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[yfinance-full-universe-study]') && needs.yfinance-sync-tests.result == 'success' && (needs.yfinance-capacity-study.result == 'success' || needs.yfinance-capacity-study.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Fetch the full J-Quants universe and publish yfinance v2 to R2
        run: set -o pipefail; python scripts/yfinance_r2/sync_v2.py --publish --workers 24 --reprocess-successful 2>&1 | tee sync-output.txt
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
          YFINANCE_V2_WORKERS: "24"
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save full-universe sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-full-universe-study-${{ github.run_id }}
          path: sync-output.txt
          if-no-files-found: ignore
          retention-days: 30

  yfinance-capacity-study:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[yfinance-capacity-study]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Measure 20 and 500 security workloads at 16 and 24 workers
        run: |
          set -euo pipefail
          YFINANCE_BENCHMARK_SAMPLE_SIZE=20 YFINANCE_BENCHMARK_WORKERS=16 python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee -a benchmark-output.txt
          YFINANCE_BENCHMARK_SAMPLE_SIZE=500 YFINANCE_BENCHMARK_WORKERS=16 python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee -a benchmark-output.txt
          YFINANCE_BENCHMARK_SAMPLE_SIZE=500 YFINANCE_BENCHMARK_WORKERS=24 python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee -a benchmark-output.txt
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
      - name: Save capacity study report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-capacity-study-${{ github.run_id }}
          path: benchmark-output.txt
          if-no-files-found: ignore
          retention-days: 30

  yfinance-full-universe-study:
    needs: yfinance-sync-tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[yfinance-full-universe-study]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Fetch the full J-Quants universe and publish yfinance v2 to R2
        run: set -o pipefail; python scripts/yfinance_r2/sync_v2.py --publish --workers 24 --reprocess-successful 2>&1 | tee sync-output.txt
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
          YFINANCE_V2_WORKERS: "24"
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save full-universe sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-full-universe-study-${{ github.run_id }}
          path: sync-output.txt
          if-no-files-found: ignore
          retention-days: 30

  yfinance-sync-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'test' || inputs.run_mode == 'reaggregate-dividend-streaks'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install test dependencies
        run: python -m pip install "yfinance==1.7.0" "boto3>=1.35,<2" "exchange_calendars>=4.7,<5"
      - name: Run deterministic sync tests without Yahoo or R2 access
        run: python -m unittest discover -s scripts/yfinance_r2 -p 'test_*.py' -v

  yfinance-dividend-streak-reaggregation:
    needs: yfinance-sync-tests
    if: (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'reaggregate-dividend-streaks') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[yfinance-reaggregate-dividend-streaks]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install the V2 collector and R2 dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Recompute calendar-year dividend streaks from stored V2 records
        run: set -o pipefail; python scripts/yfinance_r2/reaggregate_dividend_streaks.py --publish --workers 12 --report dividend-streak-reaggregation-report.json 2>&1 | tee dividend-streak-reaggregation.log
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save R2 reaggregation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-dividend-streak-reaggregation-${{ github.run_id }}
          path: |
            dividend-streak-reaggregation.log
            dividend-streak-reaggregation-report.json
          if-no-files-found: ignore
          retention-days: 30

  yfinance-monthly-price-date-repair:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'repair-monthly-prices'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements-rights.txt
      - name: Install R2 and XTKS calendar dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements-rights.txt
      - name: Normalize saved December close dates without Yahoo requests
        run: set -o pipefail; python scripts/yfinance_r2/repair_monthly_price_dates.py 24 2>&1 | tee monthly-price-date-repair.txt
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save monthly-price repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-monthly-price-date-repair-${{ github.run_id }}
          path: monthly-price-date-repair.txt
          if-no-files-found: ignore
          retention-days: 30

  yfinance-split-transition-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'split-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only R2 audit dependency
        run: python -m pip install "boto3>=1.35,<2"
      - name: Compare split-adjusted yfinance events with issuer fiscal DPS
        run: python scripts/yfinance_r2/audit_split_transition_dividends.py --workers 24 --first-year 2018 --last-year 2026 --tolerance 0.05
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
      - name: Save split-transition audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-split-transition-audit-${{ github.run_id }}
          path: split-transition-audit/
          if-no-files-found: ignore
          retention-days: 30
