name: Update Japanese listed shares from yfinance to R2

on:
  schedule:
    # 18:30 UTC is 03:30 JST; runs after the Japanese market close.
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yfinance-r2-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Fetch and upload prices
        run: python scripts/yfinance_r2/fetch_and_upload.py
        env:
          MARKET_UNIVERSE_CSV: data/irbank/organized/d1/securities.csv
          YFINANCE_INITIAL_PERIOD: 1y
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
          R2_PREFIX: market/yfinance
