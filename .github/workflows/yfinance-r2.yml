name: Sync Japanese market data to R2 v2

on:
  schedule:
    # 12:00 UTC is 21:00 JST, after the Tokyo market close.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yfinance-r2-v2
  cancel-in-progress: false

jobs:
  market-calendar:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      is_open: ${{ steps.check.outputs.is_open }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install exchange calendar dependency
        run: python -m pip install "exchange_calendars>=4.7,<5"
      - name: Check Tokyo Stock Exchange session
        id: check
        run: python scripts/yfinance_r2/check_market_day.py

  v2-daily-sync:
    needs: market-calendar
    if: needs.market-calendar.outputs.is_open == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Fetch J-Quants universe and publish the yfinance v2 generation
        run: python scripts/yfinance_r2/sync_v2.py --publish --workers 8
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
          YFINANCE_V2_WORKERS: "8"
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
