name: Cloudflare Worker CI

on:
  push:
    paths:
      - "data/irbank/cloudflare/**"
      - ".github/workflows/cloudflare-worker-ci.yml"
      - ".github/workflows/d1-r2-migration.yml"
  pull_request:
    paths:
      - "data/irbank/cloudflare/**"
      - ".github/workflows/cloudflare-worker-ci.yml"
      - ".github/workflows/d1-r2-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker, D1 schema, R2 route, and Durable Object tests
        working-directory: data/irbank/cloudflare
        run: node --test test/*.test.mjs test/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the manual migration workflow fails closed
        working-directory: data/irbank/cloudflare
        run: python -m unittest scripts/test_migration_workflow.py
      - name: Install the Botocore client for the no-network integration test
        working-directory: data/irbank/cloudflare
        run: python -m pip install -r scripts/requirements-migration.txt
      - name: Test the resumable D1-to-R2 migration tool without credentials
        working-directory: data/irbank/cloudflare
        run: python -m unittest scripts/test_migrate_d1_to_r2.py
      - name: Test the read-only account-wide D1 usage query
        working-directory: data/irbank/cloudflare
        run: python -m unittest scripts/test_d1_daily_usage.py
