name: Publish IRBANK and Yahoo dividend history to R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dividend-history-r2-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R2 client
        run: python -m pip install "boto3>=1.35,<2"
      - name: Migrate and publish per-security dividend history
        run: python scripts/r2_unified/publish_securities.py
        env:
          CLOUDFLARE_ACCOUNT_ID: 8d8f4f1f3c53232aaf7c7d6dd7b33944
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: diview-market-data
