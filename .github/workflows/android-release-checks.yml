name: Android release checks

on:
  pull_request:
    paths:
      - 'kurogane-dividend/android/**'
      - '.github/workflows/android-release-checks.yml'
      - 'kurogane-dividend/scripts/summarize_android_checks.py'
  push:
    branches: [main]
    paths:
      - 'kurogane-dividend/android/**'
      - '.github/workflows/android-release-checks.yml'
      - 'kurogane-dividend/scripts/summarize_android_checks.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kurogane-dividend/android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android command line tools under JDK 17
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Check JDK 17 and install the existing Android SDK requirements
        run: |
          java -version
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/.*java.specification.version = //p')" = 17
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Acceptance tool refuses unrelated devices and non-JDK17 runtimes
        run: python -m unittest discover -s ../scripts -p test_android_release_acceptance.py
      - name: Unit tests, lint, debug tests and unsigned release APK/AAB
        run: >-
          bash ./gradlew --no-daemon --console plain --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
          :app:assembleRelease :app:bundleRelease
      - name: Summarize results without source snippets or exception text
        if: always()
        run: python ../scripts/summarize_android_checks.py --root app/build --output app/build/reports/release-check-summary.json
      - name: Sanitized check report (no APKs or signing credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-reports
          path: kurogane-dividend/android/app/build/reports/release-check-summary.json
          retention-days: 7

  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android command line tools under JDK 17
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM on the disposable runner
        run: sudo chown "$USER" /dev/kvm
      - name: Install the existing compile SDK requirements with JDK 17
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: API ${{ matrix.api }} instrumented regression tests with JDK 17
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          working-directory: kurogane-dividend/android
          disable-animations: true
          script: >-
            bash ./gradlew --no-daemon --console plain --max-workers=1
            -Pkotlin.compiler.execution.strategy=in-process
            :app:connectedDebugAndroidTest
      - name: Summarize device results without exception text
        if: always()
        run: python ../scripts/summarize_android_checks.py --root app/build --output app/build/reports/release-device-summary.json
      - name: Sanitized device test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-reports-api-${{ matrix.api }}
          path: kurogane-dividend/android/app/build/reports/release-device-summary.json
          retention-days: 7
