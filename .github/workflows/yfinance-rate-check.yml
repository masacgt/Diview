name: yfinance 8 requests per second validation

on:
  push:
    branches:
      - codex/yfinance-rate-check-20261016

permissions:
  contents: read

concurrency:
  group: yfinance-rate-check-20261016
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yfinance_r2/requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r scripts/yfinance_r2/requirements.txt
      - name: Measure 500 securities at a global 8 HTTP requests per second
        run: set -o pipefail; python scripts/yfinance_r2/benchmark_v2.py 2>&1 | tee benchmark-output.txt
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          YFINANCE_BENCHMARK_SAMPLE_SIZE: "500"
          YFINANCE_BENCHMARK_WORKERS: "16"
          YFINANCE_HTTP_MAX_REQUESTS_PER_SECOND: "8"
          YFINANCE_HTTP_TIMEOUT_SECONDS: "30"
          YFINANCE_LIBRARY_RETRIES: "1"
      - name: Save benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yfinance-rate-check-${{ github.run_id }}
          path: benchmark-output.txt
          if-no-files-found: ignore
          retention-days: 30
